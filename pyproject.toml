[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "touchstone"
version = "0.1.0"
description = "Prove whether a cheaper or open LLM is good enough before you switch — capture, benchmark, prove."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sam Larson", email = "sam@pebbleml.com" }]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "simpleeval>=0.9.13",
    "jsonschema>=4.21",
    "python-multipart>=0.0.9",
    "websockets>=12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
touchstone = "touchstone.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["touchstone"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
