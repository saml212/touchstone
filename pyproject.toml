[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "touchstone-bench"
version = "0.1.7"
description = "Turn a company's running AI agent into a Harbor benchmark of its own work — capture, survey, review, train."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sam Larson", email = "sam@pebbleml.com" }]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
otel = ["opentelemetry-sdk>=1.20"]

[project.scripts]
touchstone = "touchstone.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "complexipy==5.5.0", # cognitive-complexity gate (<= 8/function); pinned — 8.x rescored higher
    "openai>=1.40", # real-SDK live smoke test (tests/test_live_smoke.py, TOUCHSTONE_LIVE=1)
    "requests>=2.31", # network-shim test covers both HTTP libraries (tests/test_survey_netshim.py)
    "litellm>=1.102.1",
]

[tool.hatch.build.targets.wheel]
packages = ["touchstone"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/File()/Form()/Query() belong in argument defaults by design.
"touchstone/server/app.py" = ["B008"]
"touchstone/server/routes/*.py" = ["B008"]
