<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Touchstone review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="stylesheet" href="/static/room.css" />
</head>
<body class="review-body">
  <header class="topbar">
    <span class="brand">Touchstone</span>
    <span class="goal" id="topic"></span>
    <span class="readout">
      <span class="trust" id="trust">trust —</span>
      <span class="queue" id="queue"></span>
    </span>
    <span class="closed hidden" id="closed">closed</span>
  </header>

  <main class="review" id="room">
    <section id="trial">
      <p id="trialEmpty" class="empty">Say “start” or click below and I’ll pull up the first trial.</p>
      <article id="trialCard" class="hidden">
        <h2 id="trialTask"></h2>
        <div id="trialReward" class="reward"></div>
        <p class="label">What the customer asked</p>
        <blockquote id="trialInstruction" class="instruction"></blockquote>
        <p class="label">What the agent did</p>
        <ol id="trialTrajectory" class="trajectory"></ol>
        <p class="label">What was checked</p>
        <ul id="trialCriteria" class="criteria"></ul>
        <div id="trialProposed" class="proposed hidden"></div>
      </article>
    </section>

    <section id="conversation">
      <div id="messages" class="captions" role="log" aria-live="polite" aria-label="Conversation"></div>
    </section>
  </main>

  <div class="bottombar" id="bottombar">
    <div id="notice" class="notice hidden" role="status"></div>
    <div class="dock" id="dock">
      <button id="talk" class="mic" aria-label="Microphone" aria-pressed="false">
        <span class="ring" aria-hidden="true"></span>
        <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z" />
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
      <span id="voiceState" class="voiceState">mic off</span>
      <input id="text" class="composer" type="text" autocomplete="off"
             placeholder="Or type — agree, or say what should have counted. Enter to send." />
      <button id="next" class="ghost next" title="Next trial">next trial ›</button>
    </div>
  </div>

  <div id="startOverlay" class="overlay">
    <div class="card">
      <span class="brand">Touchstone</span>
      <p class="tagline">Review your benchmark by voice.</p>
      <button id="startBtn" class="startBtn">▶ start</button>
      <p id="startHint" class="startHint"></p>
    </div>
  </div>

  <script src="/static/voice.js"></script>
  <script src="/static/room.js"></script>
</body>
</html>
